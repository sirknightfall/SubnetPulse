services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subnetpulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/subnetpulse.db
      - PING_CONCURRENCY=128
      - PING_TIMEOUT_SECONDS=1.5
      - SCHEDULER_TICK_SECONDS=15
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - ADMIN_API_KEY=${ADMIN_API_KEY:-sp-admin-secret-key-2026}
      - VIEWER_API_KEY=${VIEWER_API_KEY:-sp-viewer-readonly-key-2026}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-subnetpulse-admin}
      - VIEWER_USERNAME=${VIEWER_USERNAME:-auditor}
      - VIEWER_PASSWORD=${VIEWER_PASSWORD:-subnetpulse-viewer}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-subnetpulse-hmac-signing-secret-2026}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - subnetpulse_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: subnetpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - subnetpulse_net

volumes:
  sqlite_data:
    driver: local

networks:
  subnetpulse_net:
    driver: bridge
